# Project-scoped Codex configuration for trusted repositories.
# Keep MCP servers disabled by default. Enable only after you trust the project and set required environment variables.

sandbox_mode = "workspace-write"
approval_policy = "on-request"

[sandbox_workspace_write]
network_access = false

# GitHub MCP: Issues, PRs, repository context, Actions, and code security context.
# Before enabling, run:
#   export GITHUB_PERSONAL_ACCESS_TOKEN="$(gh auth token)"
# The toolsets are intentionally limited to project delivery needs.
[mcp_servers.github]
command = "docker"
args = [
  "run",
  "-i",
  "--rm",
  "-e",
  "GITHUB_PERSONAL_ACCESS_TOKEN",
  "-e",
  "GITHUB_TOOLSETS",
  "ghcr.io/github/github-mcp-server"
]
env = { GITHUB_TOOLSETS = "context,repos,issues,pull_requests,actions,code_security" }
env_vars = ["GITHUB_PERSONAL_ACCESS_TOKEN"]
startup_timeout_sec = 20
tool_timeout_sec = 90
enabled = false
required = false

# Context7 MCP: up-to-date developer documentation for libraries/frameworks.
# Enable only when the task requires current package or framework documentation.
[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_sec = 20
tool_timeout_sec = 90
enabled = false
required = false
