# Project-scoped Codex configuration for trusted repositories.
# Keep MCP servers disabled by default. Enable only after you trust the project and set required environment variables.

sandbox_mode = "workspace-write"
approval_policy = "on-request"

[sandbox_workspace_write]
network_access = false

# GitHub MCP: Issues, PRs, repository context, Actions, and code security context.
# Before enabling, explicitly select a target-project token, actor and
# owner/repository. scripts/run-github-mcp.sh verifies them before Docker starts.
[mcp_servers.github]
command = "bash"
args = ["scripts/run-github-mcp.sh"]
env = { GITHUB_TOOLSETS = "context,repos,issues,pull_requests,actions,code_security" }
env_vars = ["AGENT_GITHUB_TOKEN", "AGENT_GITHUB_ACTOR", "AGENT_GITHUB_REPOSITORY"]
startup_timeout_sec = 20
tool_timeout_sec = 90
enabled = false
required = false

# Context7 MCP: up-to-date developer documentation for libraries/frameworks.
# Enable only when the task requires current package or framework documentation.
[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_sec = 20
tool_timeout_sec = 90
enabled = false
required = false
